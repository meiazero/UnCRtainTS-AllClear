[project]
name = "uncrtaints-allclear"
version = "0.1.0"
description = "UnCRtainTS fork adapted to the AllClear dataset (LNLM baselines)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.11.0",
  "numpy>=2.5.1",
  "rasterio>=1.5.0",  # used by allclear.dataset, loaded at runtime from the AllClear repo
  "tensorboard>=2.20",
  "torch>=2.13.0",
  "tqdm>=4.67",
]

[project.optional-dependencies]
profile = ["fvcore>=0.1.5"]
